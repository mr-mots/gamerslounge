<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Website</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <header>
        <a href="#" class="logo">GAMERS<span>LOUNGE</span></a>

        <ul class="nav">
            <li><a href="index.html">Home</a></li>
            <li><a href="store.html">Store</a></li>
            <li><a href="news.html">News</a></li>
            <li><a href="tournament.html">Tournaments</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="action">
            <div class="searchBx">
                <a href="#"><i class="bx bx-search"></i></a>
                <input type="text" placeholder="Search Games">
            </div>
        </div>

        <div class="nav-icons">
            <i class='bx bx-bell  bx-tada' id="bell-icon"><span></span></i>
            <i class='bx bxs-download'></i>
        </div>

        <div class="notification">
            <div class="notification-box">
                <i class='bx bxs-check-circle'></i>
                <p>Congratulations, Your game downloaded successfully.</p>
            </div>
            <div class="notification-box box-color">
                <i class='bx bxs-x-circle' ></i>
                <p>Could not apply changes.</p>
            </div>
        </div>
        <div class="toggleMenu" onclick="toggleMenu()"></div>
    </header>

    <main class="page wide">
        <!-- All tournaments -->
        <section id="t-list-view">
            <h1>Live <span>Tournaments</span></h1>
            <p class="muted">Join a bracket, play your matches and climb to the final.</p>
            <div id="t-grid" class="t-grid"></div>

            <details id="t-create" class="t-create" hidden>
                <summary>Admin: create a tournament</summary>
                <form id="t-create-form" novalidate>
                    <label for="t-name">Name</label>
                    <input id="t-name" name="name" type="text" maxlength="120" placeholder="Weekend Cup">
                    <label for="t-game">Game (optional)</label>
                    <select id="t-game" name="gameId"><option value="">Any game</option></select>
                    <label for="t-max">Max players (2 - 64)</label>
                    <input id="t-max" name="maxPlayers" type="number" min="2" max="64" value="16">
                    <label for="t-start">Start date (optional)</label>
                    <input id="t-start" name="startsAt" type="datetime-local">
                    <p id="t-create-msg" class="form-msg" role="status"></p>
                    <button type="submit" class="btn-main">Create tournament</button>
                </form>
            </details>
        </section>

        <!-- One tournament + its bracket -->
        <section id="t-detail-view" hidden></section>
    </main>

    <footer>
        <div class="info">
            <a href="#" class="logo">GamersLounge</a>
            <p><i class='bx bx-copyright'></i>2023 All Rights Reserved</p>
            <ul>
                <li><a href="#"><i class='bx bxl-facebook' ></i></a></li>
                <li><a href="#"><i class='bx bxl-instagram' ></i></a></li>
                <li><a href="#"><i class='bx bxl-twitter' ></i></a></li>
                <li><a href="#"><i class='bx bxl-youtube' ></i></a></li>
            </ul>
        </div>
    </footer>



   










    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <script>
        // sticky navbar
        window.addEventListener('scroll', function () {
            var header = document.querySelector('header');
            header.classList.toggle('sticky', window.scrollY > 0);
        });

        // responsive navbar

        function toggleMenu(){
            const toggleMenu = document.querySelector('.toggleMenu');
            const nav = document.querySelector('.nav');
            toggleMenu.classList.toggle('active')
            nav.classList.toggle('active')
        }

              // notifiacation
         let bell = document.querySelector('.notification');

        document.querySelector('#bell-icon').onclick = () =>{
        bell.classList.toggle('toxic');
}
    </script>
    <script src="js/site.js"></script>
    <script src="js/tournament.js"></script>
</body>
