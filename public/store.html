<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Website</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <header>
        <a href="#" class="logo">GamersLounge</a>
        <ul class="nav">
            <li><a href="index.html">Home</a></li>
            <li><a href="store.html">Store</a></li>
            <li><a href="news.html">News</a></li>
            <li><a href="tournament.html">Tournaments</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="action">
            <div class="searchBx">
                <a href="#"><i class="bx bx-search"></i></a>
                <input type="text" placeholder="Search Games">
            </div>
        </div>
        <div class="nav-icons">
            <i class='bx bx-bell  bx-tada' id="bell-icon"><span></span></i>
            <i class='bx bxs-download'></i>
        </div>

        <div class="notification">
            <div class="notification-box">
                <i class='bx bxs-check-circle'></i>
                <p>Congratulations, Your game downloaded successfully.</p>
            </div>
            <div class="notification-box box-color">
                <i class='bx bxs-x-circle' ></i>
                <p>Could not apply changes.</p>
            </div>
        </div>
        <div class="toggleMenu" onclick="toggleMenu()"></div>
    </header>

    <!-- store -->
    <div class="games animeX" id="games">
        <ul>
            <li class="list active" data-filter="all">All</li>
            <li class="list" data-filter="pc">Pc games</li>
            <li class="list" data-filter="mobile">Mobile games</li>
        </ul>
        <div class="cardBx" id="cardBx"></div>
    </div>



<!-- footer -->
<footer>
    <div class="info">
        <a href="#" class="logo">GamersLounge</a>
        <p><i class='bx bx-copyright'></i>2023 All Rights Reserved</p>
        <ul>
            <li><a href="#"><i class='bx bxl-facebook' ></i></a></li>
            <li><a href="#"><i class='bx bxl-instagram' ></i></a></li>
            <li><a href="#"><i class='bx bxl-twitter' ></i></a></li>
            <li><a href="#"><i class='bx bxl-youtube' ></i></a></li>
        </ul>
    </div>
</footer>


<!-- script -->
    <script>
                window.addEventListener('scroll',function(){
            var anime = document.querySelectorAll('.animeX');

            for(var s = 0; s < anime.length; s++){
                var windowheight = window.innerHeight;
                var animetop = anime[s].getBoundingClientRect().top;
                var animepoint = 150;

                if(animetop < windowheight - animepoint){
                    anime[s].classList.add('active');
                }
                else{
                    anime[s].classList.remove('active');
                }
            }
        })
        // sticky navbar
        window.addEventListener('scroll', function () {
            var header = document.querySelector('header');
            header.classList.toggle('sticky', window.scrollY > 0);
        });

        // responsive navbar

        function toggleMenu(){
            const toggleMenu = document.querySelector('.toggleMenu');
            const nav = document.querySelector('.nav');
            toggleMenu.classList.toggle('active')
            nav.classList.toggle('active')
        }

              // notifiacation
         let bell = document.querySelector('.notification');

        document.querySelector('#bell-icon').onclick = () =>{
        bell.classList.toggle('toxic');
}

    </script>
    <script src="js/site.js"></script>
    <script src="js/store.js"></script>
</body>
